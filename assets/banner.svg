<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- decorative grid dots -->
  <g opacity="0.15">
    <circle cx="60" cy="40" r="2" fill="#ffffff"/>
    <circle cx="100" cy="40" r="2" fill="#ffffff"/>
    <circle cx="140" cy="40" r="2" fill="#ffffff"/>
    <circle cx="900" cy="180" r="2" fill="#ffffff"/>
    <circle cx="940" cy="180" r="2" fill="#ffffff"/>
    <circle cx="860" cy="180" r="2" fill="#ffffff"/>
  </g>

  <!-- doc/readme icon -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="#ffffff" opacity="0.95"/>
    <rect x="0" y="0" width="80" height="100" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <rect x="14" y="20" width="52" height="6" rx="3" fill="#4c1d95"/>
    <rect x="14" y="34" width="52" height="6" rx="3" fill="#818cf8"/>
    <rect x="14" y="48" width="36" height="6" rx="3" fill="#818cf8"/>
    <rect x="14" y="68" width="30" height="20" rx="4" fill="url(#accent)"/>
    <path d="M20 78 l4 4 l8 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkle -->
  <g transform="translate(155, 45)" fill="#c084fc">
    <path d="M0 8 L2 2 L8 0 L2 -2 L0 -8 L-2 -2 L-8 0 L-2 2 Z"/>
  </g>

  <!-- text -->
  <text x="200" y="105" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#ffffff">
    README Generator
  </text>
  <text x="200" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c7d2fe">
    Auto-generate professional README.md from any local or remote repo
  </text>

  <!-- tech pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">
    <rect x="200" y="155" width="90" height="26" rx="13" fill="#ffffff" opacity="0.12"/>
    <text x="215" y="172" fill="#e0e7ff">LangGraph</text>

    <rect x="300" y="155" width="70" height="26" rx="13" fill="#ffffff" opacity="0.12"/>
    <text x="315" y="172" fill="#e0e7ff">Docker</text>

    <rect x="380" y="155" width="90" height="26" rx="13" fill="#ffffff" opacity="0.12"/>
    <text x="395" y="172" fill="#e0e7ff">Streamlit</text>

    <rect x="480" y="155" width="70" height="26" rx="13" fill="#ffffff" opacity="0.12"/>
    <text x="495" y="172" fill="#e0e7ff">Multi-LLM</text>
  </g>
</svg>
